# A new version: a pushed tag v* (git tag v1.2.0 && git push origin v1.2.0). On Linux, Windows and
# macOS the server (Go: vet, build, tests) and the IDE (Node: its tests) are tested, the binaries are
# built (one file per system: the Go server with the IDE built in, tools/dist.mjs), each starts on its
# system (tools/smoke.mjs), then a release with them. Pushes to branches and pull requests run nothing;
# a run by hand (Actions > CI > Run workflow) builds and tests the same, its binaries are the artifacts
# of the run, no release.
name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# the version in the binaries and their file names: the tag of a release, else dev-RUN (dev-42)
env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.run_number) }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: macOS }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false                      # the server has no dependencies: nothing to cache

      - uses: actions/setup-node@v4
        with:
          node-version: 22                  # the IDE has no packages either

      - name: server - vet
        run: go vet ./...

      # without cgo, as the binaries: the server is the net package only
      - name: server - build
        env: { CGO_ENABLED: '0' }
        run: go build -trimpath -ldflags "-s -w" -o bin/ ./cmd/nerdsuite

      - name: server - tests
        run: go test ./...

      - name: IDE - tests
        run: npm test

  # the binaries of Windows and Linux, packed with UPX; macOS in the job after it. The version is in
  # the file names
  # (nerdsuite-v1.0-windows-amd64.exe); the artifacts keep names without it
  dist:
    name: Binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: UPX 4.2.4 (the packages of Ubuntu have an older one)
        run: |
          curl -fsSL https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/upx-4.2.4-amd64_linux" >> "$GITHUB_PATH"
      - name: build
        run: |
          node tools/dist.mjs --upx --only windows-amd64,linux-amd64,linux-arm64 --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with: { name: nerdsuite-windows-amd64.exe, path: build/dist/nerdsuite-*-windows-amd64.exe, if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: nerdsuite-linux-amd64, path: build/dist/nerdsuite-*-linux-amd64, if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: nerdsuite-linux-arm64, path: build/dist/nerdsuite-*-linux-arm64, if-no-files-found: error, retention-days: 30 }

  # macOS on a Mac: its lipo joins arm64 (Apple silicon) and amd64 (Intel) into one file,
  # nerdsuite-VERSION-macos; not packed (UPX 4 does not pack macOS). dist.mjs signs it ad hoc
  # (codesign -s -), which Apple silicon requires; no Developer ID, so no notarization
  dist-macos:
    name: Binary macOS
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: build
        run: |
          node tools/dist.mjs --no-upx --only darwin-arm64,darwin-amd64 --version "$VERSION"
          lipo -info build/dist/nerdsuite-*-macos
          codesign --verify --verbose build/dist/nerdsuite-*-macos
      - uses: actions/upload-artifact@v4
        with: { name: nerdsuite-macos, path: build/dist/nerdsuite-*-macos, if-no-files-found: error, retention-days: 30 }

  # each binary on its system, as a user gets it: it starts, answers with its version, hands out the IDE,
  # the example project and the settings
  smoke:
    name: Binary on ${{ matrix.name }}
    needs: [dist, dist-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux, file: nerdsuite-linux-amd64, system: linux-amd64 }
          - { os: windows-latest, name: Windows, file: nerdsuite-windows-amd64.exe, system: windows-amd64.exe }
          - { os: macos-latest, name: macOS, file: nerdsuite-macos, system: macos }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: '${{ matrix.file }}', path: dist }
      - shell: bash
        run: |
          node tools/smoke.mjs dist/nerdsuite-*-${{ matrix.system }} --version "$VERSION"

  # the release of a version - a pushed tag v* only: the binaries of the three systems. The artifacts and
  # a download lose the executable bit, so macOS and Linux are also packed in a .tar.gz, which keeps it; the
  # quarantine of macOS (no Developer ID, no notarization) and SmartScreen of Windows (not signed) only the
  # user can pass - the notes say how
  release:
    name: Release
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: the release with its binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find dist -type f
          for f in $(find dist -type f -name 'nerdsuite-*' ! -name '*.exe'); do
            chmod +x "$f"
            tar -czf "dist/$(basename "$f").tar.gz" -C "$(dirname "$f")" "$(basename "$f")"
          done
          mac=$(basename "$(find dist -type f -name 'nerdsuite-*-macos')")
          linux=nerdsuite-${{ github.ref_name }}-linux-amd64
          win=nerdsuite-${{ github.ref_name }}-windows-amd64.exe
          cat > notes.md <<EOF
          ## Start

          **macOS** - the app is not notarized, so macOS blocks the download until its quarantine is removed:
          \`\`\`sh
          chmod +x $mac
          xattr -d com.apple.quarantine $mac
          ./$mac
          \`\`\`
          From \`$mac.tar.gz\` (unpacked, it is executable already): \`tar -xzf $mac.tar.gz && xattr -d com.apple.quarantine $mac && ./$mac\`

          **Linux** (amd64; arm64 the same) - a download loses the executable bit:
          \`\`\`sh
          chmod +x $linux
          ./$linux
          \`\`\`
          From \`$linux.tar.gz\` (unpacked, it is executable already): \`tar -xzf $linux.tar.gz && ./$linux\`. In a file manager: Properties, Permissions, *Allow executing file as program*.

          **Windows** - the program is not signed, so SmartScreen stops its first start with *Windows protected your PC*: click **More info**, then **Run anyway**. Or unblock the download once, in its Properties (**Unblock**) or in PowerShell:
          \`\`\`powershell
          Unblock-File .\\$win
          .\\$win
          \`\`\`

          EOF
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "NerdSuite ${{ github.ref_name }}" --generate-notes \
            --notes-file notes.md $(find dist -type f -name 'nerdsuite-*')
